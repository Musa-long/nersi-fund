databases:
  - name: nersi-db
    plan: free
    databaseName: nersi

services:
  - type: web
    name: nersi-portal
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nersi-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: NODE_VERSION
        value: "20.18.1"
